<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background glow -->
    <filter id="pbrGlow" x="-25%" y="-25%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#042f1a" flood-opacity="0.6" />
    </filter>

    <!-- Top facet: Diffuse / Albedo Emerald Gradient -->
    <linearGradient id="facetDiffuse" x1="16" y1="12" x2="48" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Left facet: Tangent-Space Normal Vector Field Gradient -->
    <linearGradient id="facetNormal" x1="12" y1="24" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="80%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Right facet: Metallic / Roughness / Height Relief Gradient -->
    <linearGradient id="facetRoughness" x1="32" y1="24" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Edge Highlight Linear Gradients -->
    <linearGradient id="topEdgeGlint" x1="12" y1="20" x2="32" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.85)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)" />
    </linearGradient>

    <linearGradient id="centerRidge" x1="32" y1="32" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="32" cy="32" r="24" fill="#10b981" opacity="0.18" filter="url(#pbrGlow)" />

  <g filter="url(#shadow)">
    <!-- ── TOP FACET: DIFFUSE ALBEDO GRID ─────────────────── -->
    <!-- Isometric Top Rhombus -->
    <path d="M32 9 L52 20.5 L32 32 L12 20.5 Z" fill="url(#facetDiffuse)" stroke="rgba(255,255,255,0.3)" stroke-width="0.8" stroke-linejoin="round" />

    <!-- Albedo Micro-Grid Texture on Top Facet -->
    <path d="M22 14.8 L42 26.3 M17 17.6 L37 29.2 M27 12 L47 23.5" stroke="rgba(255,255,255,0.28)" stroke-width="0.8" stroke-linecap="round" />
    <path d="M22 26.3 L42 14.8 M27 29.2 L47 17.6 M17 23.5 L37 12" stroke="rgba(255,255,255,0.22)" stroke-width="0.8" stroke-linecap="round" />

    <!-- ── LEFT FACET: TANGENT-SPACE NORMAL MAP ────────────── -->
    <path d="M12 20.5 L32 32 L32 55 L12 43.5 Z" fill="url(#facetNormal)" stroke="rgba(255,255,255,0.18)" stroke-width="0.8" stroke-linejoin="round" />

    <!-- Normal Map Tangent Vector Waves (Curvature Relief) -->
    <path d="M12 28 Q22 30 32 39.5" stroke="rgba(56,189,248,0.55)" stroke-width="1" fill="none" stroke-linecap="round" />
    <path d="M12 35 Q22 37 32 46.5" stroke="rgba(167,139,250,0.6)" stroke-width="1" fill="none" stroke-linecap="round" />
    <circle cx="21" cy="31" r="1.5" fill="#38bdf8" />
    <circle cx="25" cy="40" r="1.5" fill="#818cf8" />

    <!-- ── RIGHT FACET: ROUGHNESS / METALLIC RELIEF ───────── -->
    <path d="M32 32 L52 20.5 L52 43.5 L32 55 Z" fill="url(#facetRoughness)" stroke="rgba(255,255,255,0.18)" stroke-width="0.8" stroke-linejoin="round" />

    <!-- Metallic Specular Contour Lines & Microfacets -->
    <path d="M32 37.5 L52 26 M32 43.5 L52 32 M32 49.5 L52 38" stroke="rgba(52,211,153,0.35)" stroke-width="0.85" stroke-linecap="round" />
    <path d="M40 28.5 L48 33" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="43" cy="37" r="1.2" fill="#34d399" />

    <!-- ── SHARP PRECISION EDGES & CORNERS ───────────────── -->
    <!-- Top-left highlight edge -->
    <path d="M12 20.5 L32 9" stroke="url(#topEdgeGlint)" stroke-width="1.5" stroke-linecap="round" />
    <!-- Center vertical dividing seam -->
    <path d="M32 32 L32 55" stroke="url(#centerRidge)" stroke-width="1.2" stroke-linecap="round" />
    <!-- Center top vertex gleam point -->
    <circle cx="32" cy="9" r="1.2" fill="#ffffff" />
    <!-- Center junction gleam point -->
    <circle cx="32" cy="32" r="1.4" fill="#a7f3d0" />
  </g>
</svg>
