# Builds the Mac and Windows apps.
#  - Every push to main: apps are built, self-tested, and published to the
#    GitHub Release named after version.py (e.g. v1.1.0). Bump version.py to
#    start a new release; pushes without a bump refresh the current one.
name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon (M1–M4)
            kind: mac
            optional: false
          - os: macos-15-intel    # Intel Macs
            kind: mac
            optional: true
          - os: windows-latest
            kind: win
            optional: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    env:
      TMM_DATA_DIR: ${{ github.workspace }}/ci-data
      # Optional Apple Developer secrets (Settings → Secrets → Actions).
      # Without them the Mac app is still built, just not notarized.
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'from version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Test from source
        run: python desktop.py --smoke-test

      - name: Build app (PyInstaller)
        run: pyinstaller packaging/TextureMapMaker.spec --noconfirm --clean

      # ── macOS ──────────────────────────────────────────────
      - name: Test packaged app (mac)
        if: matrix.kind == 'mac'
        run: '"dist/Texture Map Maker.app/Contents/MacOS/Texture Map Maker" --smoke-test'

      - name: Sign + notarize (only if Apple secrets are set)
        if: matrix.kind == 'mac' && env.APPLE_CERT_P12 != ''
        run: |
          echo "$APPLE_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          codesign --force --deep --options runtime --timestamp \
            --entitlements packaging/entitlements.plist \
            --sign "$APPLE_SIGN_IDENTITY" "dist/Texture Map Maker.app"

      - name: Make .dmg
        if: matrix.kind == 'mac'
        run: bash packaging/make_dmg.sh "${{ steps.ver.outputs.version }}" "$(uname -m)"

      - name: Notarize .dmg (only if Apple secrets are set)
        if: matrix.kind == 'mac' && env.APPLE_ID != '' && env.APPLE_CERT_P12 != ''
        run: |
          DMG=$(ls dist/*.dmg)
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"

      # ── Windows ────────────────────────────────────────────
      - name: Test packaged app (Windows)
        if: matrix.kind == 'win'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\TextureMapMaker\TextureMapMaker.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          Get-Content "$env:TMM_DATA_DIR\smoke-test.txt"
          if ($p.ExitCode -ne 0) { throw "smoke test failed ($($p.ExitCode))" }

      - name: Make installer + portable zip (Windows)
        if: matrix.kind == 'win'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" packaging\windows-installer.iss
          Compress-Archive -Path "dist\TextureMapMaker\*" -DestinationPath "dist\TextureMapMaker-${{ steps.ver.outputs.version }}-Windows-Portable.zip"

      # ── Publish ────────────────────────────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: TextureMapMaker-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*-Setup.exe
            dist/*-Portable.zip
          if-no-files-found: error

      - name: Publish GitHub Release v<version.py>
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Texture Map Maker ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body: |
            ## Download
            | System | File |
            |---|---|
            | Mac — Apple Silicon (M1–M4) | `TextureMapMaker-${{ steps.ver.outputs.version }}-macOS-AppleSilicon.dmg` |
            | Mac — Intel | `TextureMapMaker-${{ steps.ver.outputs.version }}-macOS-Intel.dmg` |
            | Windows (installer) | `TextureMapMaker-${{ steps.ver.outputs.version }}-Windows-Setup.exe` |
            | Windows (no install) | `TextureMapMaker-${{ steps.ver.outputs.version }}-Windows-Portable.zip` |

            Free · offline · no API key. Diffuse → Normal / Height / Roughness / AO, seamless textures, live 3D preview.

            **First launch:** Mac — System Settings → Privacy & Security → *Open Anyway*. Windows — *More info → Run anyway*.
          files: |
            dist/*.dmg
            dist/*-Setup.exe
            dist/*-Portable.zip
